server.port=0
# 宿主接口版本（扩展的 apiVersionRange 将与之匹配）
host.api-version=1.2.0
# 宿主实际提供的能力标识，逗号分隔
host.capabilities=commands,settings,keybindings,languages,panels
# 版本/能力不满足时的策略：REJECT（整体拒绝）或 DEGRADE（剔除不兼容扩展）
host.mismatch-policy=REJECT
# 清单未声明 priority 时的默认合并优先级
host.default-priority=0
# 扩展集合本地持久化文件，留空则不持久化
host.store-file=
